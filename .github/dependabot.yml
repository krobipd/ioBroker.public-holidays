# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:

  # Root npm — the adapter's own runtime/dev dependencies.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    assignees:
      - 'krobipd'
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      # date-holidays is held at npm-latest by the release currency gate + `npm run generate` — no dependabot PRs needed.
      - dependency-name: 'date-holidays'

  # src-admin (Module-Federation admin component): hand-pinned compatibility matrix
  # (React 18 / MUI 6 / @module-federation/vite 1.2.6 …). npm-latest breaks the MF build.
  # This entry exists ONLY to satisfy repochecker W8905 (a non-root package.json must be
  # covered by a dependabot npm directory). Ignoring all dependencies means it generates
  # ZERO pull requests, so the pinned matrix is never moved. (open-pull-requests-limit: 0
  # would trip W8907; a wildcard ignore keeps the entry warning-free.)
  - package-ecosystem: 'npm'
    directory: '/src-admin'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Berlin'
    assignees:
      - 'krobipd'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    assignees:
      - 'krobipd'
