# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:

  - package-ecosystem: 'npm'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    assignees:
      - 'krobipd'
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      # Module-Federation admin component (src-admin): hand-tuned compat matrix —
      # npm latest breaks the MF build (MF-vite 1.8+ crashes), date-holidays must match
      # the runtime. Exact-pinned; block all updates so automerge cannot move them.
      # No-op in adapters without these deps.
      - dependency-name: '@module-federation/vite'
      - dependency-name: 'vite'
      - dependency-name: 'date-holidays'
    directories:
      - '**/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    assignees:
      - 'krobipd'
