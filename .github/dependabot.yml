# Dependabot will run on day 25 of each month at 03:51 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    assignees:
      - 'krobipd'
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'date-holidays'

  - package-ecosystem: 'npm'
    directory: '/src-admin'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Berlin'
    assignees:
      - 'krobipd'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
    open-pull-requests-limit: 15

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    assignees:
      - 'krobipd'
